<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" role="img" aria-labelledby="title description">
  <title id="title">Capstone SDLC framework and development repository relationship</title>
  <desc id="description">Capstone reads a Jira requirement, creates acceptance criteria, implements and tests changes in the independent Spring PetClinic repository, then presents the result for human review. Workflow artifacts remain outside the PetClinic checkout.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .label { font-size: 13px; }
      .small { font-size: 12px; }
      .muted { fill: #475569; }
      .title { font-size: 20px; font-weight: 700; }
      .repo-title { font-size: 17px; font-weight: 700; }
      .panel { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
      .framework { fill: #f1f5f9; stroke: #475569; }
      .petclinic { fill: #f0fdf4; stroke: #16a34a; }
      .other { fill: #eff6ff; stroke: #2563eb; }
      .config { fill: #ecfeff; stroke: #0d9488; }
      .artifact { fill: #fff7ed; stroke: #ea580c; }
      .tile { fill: #ffffff; stroke: #94a3b8; }
      .flow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect x="170" y="25" width="840" height="185" rx="12" class="panel framework"/>
  <text x="590" y="52" text-anchor="middle" class="small muted">REPOSITORY 1 · INDEPENDENT GIT REPOSITORY</text>
  <text x="590" y="79" text-anchor="middle" class="title">Capstone AI-SDLC Framework</text>
  <rect x="195" y="98" width="185" height="54" rx="7" class="tile"/>
  <text x="287" y="121" text-anchor="middle" class="label">SDLC skills &amp; agents</text>
  <text x="287" y="139" text-anchor="middle" class="small muted">requirements → code → review</text>
  <rect x="395" y="98" width="185" height="54" rx="7" class="tile"/>
  <text x="487" y="121" text-anchor="middle" class="label">Jira / GitHub integrations</text>
  <text x="487" y="139" text-anchor="middle" class="small muted">issue context and evidence</text>
  <rect x="595" y="98" width="185" height="54" rx="7" class="tile"/>
  <text x="687" y="121" text-anchor="middle" class="label">Guardrails &amp; approvals</text>
  <text x="687" y="139" text-anchor="middle" class="small muted">human review after tests</text>
  <rect x="795" y="98" width="190" height="54" rx="7" class="tile"/>
  <text x="890" y="121" text-anchor="middle" class="label">Multi-LLM orchestration</text>
  <text x="890" y="139" text-anchor="middle" class="small muted">provider only when authorized</text>
  <text x="590" y="183" text-anchor="middle" class="small muted">Framework code, configuration, and reference snapshot (repos/spring-petclinic/)</text>

  <rect x="15" y="82" width="130" height="78" rx="9" class="panel"/>
  <text x="80" y="110" text-anchor="middle" class="label" font-weight="700">Jira</text>
  <text x="80" y="130" text-anchor="middle" class="small muted">issue key → spec</text>
  <text x="80" y="147" text-anchor="middle" class="small muted">read access</text>
  <path d="M145 121 H168" class="flow"/>

  <path d="M590 210 V238" class="flow"/>
  <rect x="250" y="242" width="480" height="92" rx="9" class="panel config"/>
  <text x="490" y="267" text-anchor="middle" class="label" font-weight="700">Target repository configuration</text>
  <text x="490" y="289" text-anchor="middle" class="small">CAPSTONE_TARGET_REPO or per-run --repo override</text>
  <text x="490" y="312" text-anchor="middle" class="small muted">local checkout root · branch remains operator-controlled</text>

  <rect x="765" y="242" width="245" height="92" rx="9" class="panel artifact"/>
  <text x="887" y="267" text-anchor="middle" class="label" font-weight="700">Workflow state &amp; artifacts</text>
  <text x="887" y="289" text-anchor="middle" class="small">approvals · drafts · reports</text>
  <text x="887" y="312" text-anchor="middle" class="small muted">stored outside PetClinic</text>
  <path d="M730 288 H763" class="flow"/>

  <path d="M410 334 V365 H275 V388" class="flow"/>
  <path d="M570 334 V365 H780 V388" class="flow"/>

  <rect x="35" y="392" width="480" height="280" rx="12" class="panel petclinic"/>
  <text x="275" y="420" text-anchor="middle" class="small muted">REPOSITORY 2 · INDEPENDENT GIT REPOSITORY</text>
  <text x="275" y="450" text-anchor="middle" class="repo-title">Spring PetClinic</text>
  <text x="275" y="479" text-anchor="middle" class="label">Application source · tests · build · CI</text>
  <text x="275" y="503" text-anchor="middle" class="small muted">Development target: repository root</text>
  <text x="275" y="644" text-anchor="middle" class="small muted">Existing checkout branch and remote are preserved</text>

  <rect x="545" y="392" width="460" height="280" rx="12" class="panel other"/>
  <text x="775" y="420" text-anchor="middle" class="small muted">REPOSITORY N · INDEPENDENT TARGETS</text>
  <text x="775" y="450" text-anchor="middle" class="repo-title">Other applications</text>
  <text x="775" y="483" text-anchor="middle" class="label">Python · React · microservices</text>
  <text x="775" y="507" text-anchor="middle" class="label">Each selected through its own target path</text>
  <text x="775" y="568" text-anchor="middle" class="small muted">The same framework can coordinate</text>
  <text x="775" y="588" text-anchor="middle" class="small muted">work across separate Git checkouts.</text>
  <text x="775" y="644" text-anchor="middle" class="small muted">No shared Git root or history required</text>

  <text x="520" y="703" text-anchor="middle" class="small muted">Generated code is reviewed before integration; merge, CI writes, and deployment need separate authorization.</text>
</svg>
